# Server
server.port=8080

# Loads application-local.properties (gitignored) for datasource credentials and secrets.
# See application-local.properties.example for the required keys.
spring.profiles.active=local

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# SQL logging is off by default so query text (and any embedded values) never lands in
# production logs. Turn it on locally via application-local.properties if you need it.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
souvenirpos.jwt.expiration-ms=86400000

# CORS: comma-separated list of browser origins allowed to call the API. Override per
# deployment (e.g. your deployed web origin) in application-local.properties. A wildcard
# is intentionally NOT used because credentials (Authorization header) are allowed.
souvenirpos.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Login throttling: after max-attempts failures for a username+IP within window-seconds,
# further attempts are refused with HTTP 429 until the window rolls over.
souvenirpos.login.max-attempts=5
souvenirpos.login.window-seconds=300

# Initial seeded owner account username. The password comes from the active profile;
# if none is set, a strong random one is generated and logged once at startup.
souvenirpos.seed.owner-username=admin
