# Server
server.port=8080

# Loads application-local.properties (gitignored) for datasource credentials and secrets.
# See application-local.properties.example for the required keys.
spring.profiles.active=local

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
souvenirpos.jwt.expiration-ms=86400000

# Initial seeded owner account username (password comes from the active profile)
souvenirpos.seed.owner-username=admin
