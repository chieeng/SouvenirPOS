# All secrets and deployment-specific values are read from environment variables. In local
# development these come from a `.env` file at the backend root, loaded by spring-dotenv
# (me.paulschwarz:spring-dotenv). See .env.example for the full list. The ${VAR:default}
# form supplies a fallback; variables written as ${VAR} (no default) are REQUIRED and the
# app will fail to start if they are missing — this is intentional for secrets.

# Server
server.port=${PORT:8080}

# Datasource (REQUIRED)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate. Dev uses auto-DDL for convenience; the `prod` profile switches to
# validate + Flyway migrations (see application-prod.properties) so production schema is
# never changed by incidental startup DDL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is on the classpath for prod but OFF here so dev keeps using auto-DDL.
spring.flyway.enabled=false

# JWT: secret is REQUIRED (HMAC-SHA key, >= 32 bytes); expiry in ms.
souvenirpos.jwt.secret=${JWT_SECRET}
souvenirpos.jwt.expiration-ms=${ACCESS_TOKEN_EXPIRATION:3600000}

# CORS: browser origins allowed to call the API. Defaults to the single frontend origin
# (FRONTEND_URL); set CORS_ALLOWED_ORIGINS only if you need to allow several origins in dev.
# A wildcard is intentionally NEVER used because credentials (Authorization header) are
# allowed — "*" + credentials is rejected by browsers and unsafe.
souvenirpos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

# Web frontend URL (available to the app; e.g. for building absolute links).
souvenirpos.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Login throttling: after max-attempts failures for a username+IP within window-seconds,
# further attempts are refused with HTTP 429 until the window rolls over.
souvenirpos.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
souvenirpos.login.window-seconds=${LOGIN_WINDOW_SECONDS:300}

# Admin bootstrap: when enabled, a one-time owner account is created at startup if one does
# not already exist (idempotent — never duplicates). Enabled by default for local dev; the
# prod profile defaults it OFF. Turn it on for the first prod deploy only, then disable.
souvenirpos.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:true}

# Initial seeded owner account. If the password is left unset, a strong random one is
# generated and logged once at startup.
souvenirpos.seed.owner-username=${SEED_OWNER_USERNAME:admin}
souvenirpos.seed.owner-password=${SEED_OWNER_PASSWORD:}
