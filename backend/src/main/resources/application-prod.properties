# Production overrides. Activate by setting the environment variable:
#   SPRING_PROFILES_ACTIVE=prod
# Everything not overridden here is inherited from application.properties. All secrets still
# come from environment variables (see .env.example) — set them on the host (e.g. Render).

# --- Database safety: schema is governed by versioned migrations, never auto-DDL ---
# Hibernate only VALIDATES that the schema matches the entities; it never creates or alters
# tables in production. Schema changes ship as Flyway migrations in db/migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
# Adopt a database that already has tables (e.g. one previously created by dev auto-DDL):
# Flyway baselines it instead of failing, then applies only newer migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing schema baseline

# --- Admin bootstrap OFF by default in production ---
# For the FIRST deploy only, set ADMIN_BOOTSTRAP_ENABLED=true to create the initial owner,
# then set it back to false (or remove it) and redeploy. Creation is idempotent regardless.
souvenirpos.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}

# --- CORS locked to the single deployed frontend origin ---
# REQUIRED in prod (no default): the app will not start unless FRONTEND_URL is set, which
# prevents accidentally shipping a permissive origin.
souvenirpos.cors.allowed-origins=${FRONTEND_URL}
