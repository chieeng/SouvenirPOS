# Test configuration. Shadows the main application.properties on the test classpath so the
# Spring context loads against an in-memory H2 database with fixed, non-secret values — no
# .env, no external database, no real credentials required.

# H2 in PostgreSQL-compatibility mode; schema built from the entities for each run.
spring.datasource.url=jdbc:h2:mem:souvenirpos-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Fixed test secret (not used for anything real).
souvenirpos.jwt.secret=test-only-secret-value-at-least-32-bytes-long-000
souvenirpos.jwt.expiration-ms=3600000

souvenirpos.cors.allowed-origins=http://localhost:5173

# Don't seed an owner during tests; categories still seed harmlessly into H2.
souvenirpos.admin.bootstrap-enabled=false
souvenirpos.seed.owner-username=admin
